[package]
name = "tpt-strata-wasm"
description = "WebAssembly build of tpt-strata for the browser playground and Node.js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["wasm", "sql", "columnar", "playground", "tpt-strata"]
categories = ["wasm", "database"]
readme = "README.md"
# Not yet released. Remove this line when the crate is ready to publish.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-strata = { version = "=1.0.1", path = "../tpt-strata" }
wasm-bindgen = "=0.2.128"
serde_json = "1"

[package]
name = "tpt-strata-wasm"
description = "WebAssembly build of tpt-strata for the browser playground and Node.js"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["wasm", "sql", "columnar", "playground", "tpt-strata"]
categories = ["wasm", "database"]
readme = "README.md"
# Not for crates.io. This is the build behind the browser playground, not a
# library for consumers. Keep this line.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-strata = { version = "=0.1.0", path = "../tpt-strata" }
wasm-bindgen = "=0.2.129"
serde_json = "1"

[package]
name = "tpt-strata-parquet"
description = "Parquet import bridge for tpt-strata"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["parquet", "arrow", "columnar", "import", "tpt-strata"]
categories = ["database", "encoding"]
readme = "README.md"
documentation = "https://docs.rs/tpt-strata-parquet"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tpt-strata = { version = "=0.1.0", path = "../tpt-strata" }
parquet = { workspace = true }
arrow = { version = "60", default-features = false }
bytes = "1"

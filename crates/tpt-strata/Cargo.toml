[package]
name = "tpt-strata"
description = "Embeddable columnar query engine with zero external dependencies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["columnar", "query-engine", "sql", "embeddable", "analytics"]
categories = ["database", "data-structures", "parser-implementations"]
readme = "README.md"
documentation = "https://docs.rs/tpt-strata"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Split aggregation across threads, with std only. Off by default, so the
# default build is single-threaded and zero-dependency.
parallel = []

[dependencies]
# Zero external dependencies — this is a non-negotiable.

[[bench]]
name = "queries"
harness = false

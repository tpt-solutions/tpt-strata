[package]
name = "tpt-strata-cli"
description = "Command-line SQL over Parquet and CSV files, powered by tpt-strata"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["sql", "parquet", "csv", "cli", "tpt-strata"]
categories = ["command-line-utilities", "database"]
readme = "README.md"
# Not for crates.io. This is an end-user binary; install it from the git repo
# or from GitHub releases. Keep this line.
publish = false

[[bin]]
name = "strata"
path = "src/main.rs"

[dependencies]
tpt-strata = { version = "=0.1.0", path = "../tpt-strata" }
tpt-strata-parquet = { version = "=0.1.0", path = "../tpt-strata-parquet" }

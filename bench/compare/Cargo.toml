[package]
name = "tpt-strata-compare"
version = "0.0.0"
edition = "2021"
publish = false
description = "Head-to-head query benchmark: tpt-strata vs DataFusion vs DuckDB on the same data"

# A standalone workspace: these dependencies are heavy and are not part of the
# tpt-strata workspace, so they never affect its builds or its dependency count.
[workspace]

[dependencies]
tpt-strata = { path = "../../crates/tpt-strata" }
tpt-strata-parquet = { path = "../../crates/tpt-strata-parquet" }
datafusion = "55"
duckdb = { version = "1", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
debug = false
